name: Process Assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "thumbnails/**"
      - "index.json"
      - ".github/**"

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install sharp
        run: npm install --no-save sharp

      - name: Generate thumbnails
        run: node generate-thumbnails.js

      - name: Rebuild index
        run: node build-index.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thumbnails/ index.json
          git diff --staged --quiet || git commit -m "chore: auto-generate thumbnails and rebuild index [skip ci]" && git push
